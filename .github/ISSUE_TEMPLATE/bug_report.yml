name: 🐛 Bug Report
description: Create a report to help us improve Zero Network Connectivity
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the details below.
  - type: input
    id: version
    attributes:
      label: App Version
      description: What version of the app are you running? (e.g. v1.0.1)
      placeholder: v1.0.1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device & Android OS
      description: Which phone model and Android version? (e.g. Samsung Galaxy S23 / Android 14)
      placeholder: Pixel 7, Android 14
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Open 'Find Others'
        2. Tap 'Scan LAN'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
