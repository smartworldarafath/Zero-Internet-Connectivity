name: ✨ Feature Request
description: Suggest an idea or enhancement for Zero Network Connectivity
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make offline communication even better? Let us know!
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: What feature would you like to see?
    validations:
      required: true
  - type: textarea
    id: problem-solved
    attributes:
      label: Problem / Use Case
      description: What problem does this solve or what use case does it address?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution / Alternative
      description: Any ideas on how this could be implemented in Jetpack Compose or LAN protocols?
